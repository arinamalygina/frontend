<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend 2.0</title>
</head>
<body>
    <h1>Отправка и чтение данных</h1>
    
    <h2>Отправка</h2>
    <input type="text" id="textInput" placeholder="Введите текст">
    <button onclick="sendData()">Отправить</button>
    
    <h2>Чтение данных</h2>
    <button onclick="readData()">Показать данные</button>
    <br><br>
    <textarea id="readResult" rows="10" cols="50" readonly></textarea>
    
    <p id="result"></p>

    <script>
        async function sendData() {
            const text = document.getElementById('textInput').value;
            
            const response = await fetch('http://localhost:5000/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            const data = await response.json();
            document.getElementById('result').innerText = data.message;
        }
        
        async function readData() {
            const response = await fetch('http://localhost:5000/read');
            const data = await response.json();
            document.getElementById('readResult').value = data.content;
        }
    </script>
</body>
</html>
