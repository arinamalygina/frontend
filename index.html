<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend v2.0</title>
</head>
<body>
    <h1>Отправка данных</h1>
    <input type="text" id="textInput" placeholder="Введите текст">
    <button onclick="sendData()">Отправить</button>
    
    <h3>Ответ сервера:</h3>
    <p id="serverResponse"></p>

    <h1>Просмотр сохранённых данных</h1>
    <button onclick="loadData()">Загрузить данные</button>
    
    <h3>Содержимое data.txt:</h3>
    <pre id="dataContent"></pre>

    <script>
        // Обращаемся к нашему же Nginx, он сам перенаправит куда надо
        const API_URL = '/api/data';

        async function sendData() {
            const text = document.getElementById('textInput').value;
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await response.json();
            document.getElementById('serverResponse').innerText = JSON.stringify(data);
        }

        async function loadData() {
            const response = await fetch(API_URL);
            const data = await response.json();
            document.getElementById('dataContent').innerText = data.content;
        }
    </script>
</body>
</html>
